<div class="results-container">
    <mat-card-title>Your saved results</mat-card-title>
    <table mat-table [dataSource]="records" class="mat-elevation-z8">
        <!-- Weight Column -->
        <ng-container matColumnDef="weight">
            <th mat-header-cell *matHeaderCellDef>Weight</th>
            <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
        </ng-container>

        <!-- Height Column -->
        <ng-container matColumnDef="height">
            <th mat-header-cell *matHeaderCellDef>Height</th>
            <td mat-cell *matCellDef="let element"> {{element.height}} </td>
        </ng-container>

        <!-- Bmi Column -->
        <ng-container matColumnDef="bmi">
            <th mat-header-cell *matHeaderCellDef>Bmi</th>
            <td mat-cell *matCellDef="let element"> {{element.bmi | number:'1.2-2'}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
